# Flight rsyslog — minimal local disk logging (mission telemetry goes to MRAM).
# Keep errors/warnings only; no debug/info spam to /home.

module(load="imuxsock")
module(load="imklog")

$template KubosWithSeverity,"%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%<%syslogseverity-text%>%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
$ActionFileDefaultTemplate KubosWithSeverity

$IncludeConfig /etc/rsyslog.d/*.conf

# Console: never mirror everything (kernel console already filtered via printk)
#kern.*                                                 /dev/console

# System log: warnings and worse only
$outchannel messages_log,/var/log/messages,20000,/home/system/kubos/log-rotate.sh messages
*.warn;mail.none;authpriv.none;cron.none                :omfile:$messages_log

# Auth failures still matter
$outchannel secure_log,/var/log/secure,10000,/home/system/kubos/log-rotate.sh secure
authpriv.warning                                        :omfile:$secure_log

# Emergencies only to all users
*.emerg                                                 :omusrmsg:*
