# RadSat flight SD / eMMC layout — no 3G user partitions.
# Partition map (must stay stable for U-Boot):
#   p1  boot VFAT   MLO / u-boot / kernel / dtb
#   p2  rootfs      matches BR2_TARGET_ROOTFS_EXT2_SIZE (256M)
#   p3  envar       /uboot.env  (U-Boot EXT4_ENV → mmcX:3)
#   p4  upgrade     kpack ITBs  (KUBOS_UPGRADE_PART → 4)
#
# Approx packed size: ~16M + 256M + 2M + 32M ≈ 310M
# Fits easily on 2–8 GB industrial / SLC microSD.
#
# Flight upgrade (p4) is intentionally tiny + empty by default.
# Full kpack ITBs stay on the lab aux-sd / are applied from ground.
# Partition 4 must still exist — U-Boot KUBOS_UPGRADE_PART=4.

image boot.vfat {
    vfat {
        files = {
            "MLO",
            "u-boot.img",
            "u-boot-bak.img",
            "kernel",
            "beaglebone-black.dtb",
        }
    }
    size = 16M
}

image upgrade-flight {
    ext4 {}
    size = 32M
    mountpoint = "/upgrade"
}

image uboot-envar {
    # U-Boot 2016.09 ext4 is picky. Modern mke2fs defaults
    # (metadata_csum, 64bit, …) cause "Extent Error" / unable to
    # read uboot.env from mmc0:3. Keep this FS old-U-Boot-friendly.
    ext4 {
        use-mke2fs = "true"
        features = "^metadata_csum,^64bit,^huge_file"
    }
    size = 2M
    mountpoint = "/envar"
}

image kubos-linux-flight.img {
    hdimage {
        disk-signature = 0x4B4C4E58
    }

    partition u-boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs-flight.ext4"
        size = 256M
    }

    partition envar {
        partition-type = 0x83
        image = "uboot-envar"
        size = 2M
    }

    partition upgrade {
        partition-type = 0x83
        image = "upgrade-flight"
    }
}
