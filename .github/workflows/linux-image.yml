---
name: Build RadSat Linux Image

'on':
  workflow_dispatch:
    inputs:
      software_tag:
        description: Software release tag (blank uses BR2_KUBOS_VERSION)
        required: false
        type: string
      reset_build_cache:
        description: Clear persistent compiler and download caches
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master

concurrency:
  group: radsat-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDROOT_VERSION: 2025.02.14
  BUILDROOT_SHA256: >-
    dc36c895d189d37f443d0352202ffd6a2436afcaf21570b4d9fbb177b56dee0b
  BUILDER_IMAGE: radsat-linux-builder:buildroot-2025.02.14-rust-1.93.0-clang

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 180

    steps:
      - name: Verify runner prerequisites
        run: |
          echo "Runner: ${RUNNER_NAME}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          df -h "${GITHUB_WORKSPACE}"
          docker info >/dev/null

      - name: Require checkout token
        env:
          CI_CHECKOUT_TOKEN: ${{ secrets.CI_CHECKOUT_TOKEN }}
        run: |
          if [[ -z "${CI_CHECKOUT_TOKEN}" ]]; then
            echo "::error::Add CI_CHECKOUT_TOKEN to the radsat-linux" \
              "repository or organization secrets."
            exit 1
          fi

      - name: Check out radsat-linux
        uses: actions/checkout@v6
        with:
          path: radsat-linux
          fetch-depth: 0

      - name: Resolve Software release tag
        id: software-version
        env:
          SOFTWARE_TAG_OVERRIDE: >-
            ${{ github.event.inputs.software_tag || '' }}
        run: |
          configured_tag="$(
            sed -n 's/^BR2_KUBOS_VERSION="\([^"]*\)"/\1/p' \
              radsat-linux/configs/beaglebone-black_defconfig
          )"
          software_tag="${SOFTWARE_TAG_OVERRIDE:-${configured_tag}}"

          if [[ -z "${software_tag}" ]]; then
            echo "::error::No Software tag was supplied and" \
              "BR2_KUBOS_VERSION is empty."
            exit 1
          fi

          artifact_tag="${software_tag//\//-}"
          artifact_name="radsat-linux-${GITHUB_SHA}-software-${artifact_tag}"
          echo "software_tag=${software_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_tag=${artifact_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "Building with SkCubeSat/Software tag ${software_tag}"

      - name: Check out tagged Software source
        uses: actions/checkout@v6
        with:
          repository: SkCubeSat/Software
          ref: ${{ steps.software-version.outputs.software_tag }}
          path: Software
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CI_CHECKOUT_TOKEN }}

      - name: Verify Software source is an exact tag
        env:
          SOFTWARE_TAG: ${{ steps.software-version.outputs.software_tag }}
        run: |
          if ! git -C Software show-ref --verify --quiet \
            "refs/tags/${SOFTWARE_TAG}"; then
            echo "::error::SkCubeSat/Software ref '${SOFTWARE_TAG}'" \
              "is not a tag."
            exit 1
          fi

          tag_commit="$(git -C Software rev-list -n 1 "${SOFTWARE_TAG}")"
          head_commit="$(git -C Software rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Software checkout does not match tag" \
              "${SOFTWARE_TAG}."
            exit 1
          fi

      - name: Prepare persistent local caches
        env:
          RESET_BUILD_CACHE: >-
            ${{ github.event.inputs.reset_build_cache || 'false' }}
        run: |
          cache_root="${HOME}/.cache/radsat-linux"
          if [[ "${RESET_BUILD_CACHE}" == "true" ]]; then
            rm -rf "${cache_root}"
          fi

          board="beaglebone-black"
          software_commit="$(git -C Software rev-parse --short=12 HEAD)"
          output_cache="${cache_root}/buildroot-output/${BUILDROOT_VERSION}/${board}/${software_commit}"

          mkdir -p \
            "${cache_root}/archives" \
            "${cache_root}/buildroot-dl" \
            "${cache_root}/buildroot-ccache/${BUILDROOT_VERSION}" \
            "${cache_root}/cargo" \
            "${cache_root}/cargo-target" \
            "${output_cache}"
          echo "BUILD_CACHE_ROOT=${cache_root}" >> "${GITHUB_ENV}"
          echo "BUILD_OUTPUT_CACHE=${output_cache}" >> "${GITHUB_ENV}"

      - name: Prepare pinned builder image
        run: |
          docker build \
            --file radsat-linux/.github/runner/Dockerfile \
            --tag "${BUILDER_IMAGE}" \
            radsat-linux/.github/runner

      - name: Download Buildroot
        run: |
          archive_name="buildroot-${BUILDROOT_VERSION}.tar.gz"
          archive="${BUILD_CACHE_ROOT}/archives/${archive_name}"

          if ! echo "${BUILDROOT_SHA256}  ${archive}" |
            sha256sum --check --status -; then
            temporary_archive="${archive}.tmp"
            rm -f "${temporary_archive}"
            curl --fail --location --retry 5 \
              --output "${temporary_archive}" \
              "https://buildroot.org/downloads/${archive_name}"
            echo "${BUILDROOT_SHA256}  ${temporary_archive}" |
              sha256sum --check -
            mv "${temporary_archive}" "${archive}"
          fi

          echo "${BUILDROOT_SHA256}  ${archive}" | sha256sum --check -
          rm -rf "buildroot-${BUILDROOT_VERSION}"
          tar --extract --gzip --file "${archive}"

      - name: Build Linux image
        run: |
          kernel_input_hash="$(
            while IFS= read -r -d '' file; do
              sha256sum "radsat-linux/${file}"
            done < <(
              git -C radsat-linux ls-files -z -- \
                configs/beaglebone-black_defconfig \
                common/linux-kubos.config \
                common/patches/linux \
                board/kubos/beaglebone-black/linux \
                board/kubos/beaglebone-black/linux-kubos.config \
                board/kubos/beaglebone-black/beaglebone-black.dts \
                board/kubos/beaglebone-black/am33xx-boneblack.dtsi
            ) | sha256sum | awk "{print \$1}"
          )"
          echo "Linux input hash: ${kernel_input_hash}"

          mkdir -p ci-home
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${BUILD_CACHE_ROOT}/buildroot-dl:/cache/buildroot-dl" \
            --volume "${BUILD_CACHE_ROOT}/buildroot-ccache/${BUILDROOT_VERSION}:/cache/buildroot-ccache" \
            --volume "${BUILD_OUTPUT_CACHE}:/cache/buildroot-output" \
            --volume "${BUILD_CACHE_ROOT}/cargo:/cache/cargo" \
            --volume "${BUILD_CACHE_ROOT}/cargo-target:/cache/cargo-target" \
            --workdir "/workspace/buildroot-${BUILDROOT_VERSION}" \
            --env BUILDROOT_OUTPUT=/cache/buildroot-output \
            --env BR2_CCACHE_DIR=/cache/buildroot-ccache \
            --env BR2_DL_DIR=/cache/buildroot-dl \
            --env BR2_JLEVEL=0 \
            --env CARGO_HOME=/cache/cargo \
            --env CARGO_TARGET_DIR=/cache/cargo-target \
            --env HOME=/workspace/ci-home \
            --env KERNEL_INPUT_HASH="${kernel_input_hash}" \
            --env KUBOS_OVERRIDE_SRCDIR=/workspace/Software \
            "${BUILDER_IMAGE}" \
            bash -euxo pipefail -c '
              rustc --version
              cargo --version
              make O="${BUILDROOT_OUTPUT}" \
                BR2_EXTERNAL=/workspace/radsat-linux \
                beaglebone-black_defconfig
              if ! grep -qx "BR2_CCACHE=y" "${BUILDROOT_OUTPUT}/.config"; then
                echo "Buildroot disabled ccache; host GCC 8 or newer is required."
                exit 1
              fi

              kernel_hash_file="${BUILDROOT_OUTPUT}/.radsat-linux-kernel-inputs.sha256"
              if [[ -d "${BUILDROOT_OUTPUT}/build/linux-4.4.23" ]]; then
                previous_kernel_hash="$(cat "${kernel_hash_file}" 2>/dev/null || true)"
                if [[ "${previous_kernel_hash}" != "${KERNEL_INPUT_HASH}" ]]; then
                  echo "Linux inputs changed; cleaning Buildroot linux package."
                  make O="${BUILDROOT_OUTPUT}" linux-dirclean
                fi
              fi

              make O="${BUILDROOT_OUTPUT}" source
              make O="${BUILDROOT_OUTPUT}"
              printf "%s\n" "${KERNEL_INPUT_HASH}" > "${kernel_hash_file}"

              strings "${BUILDROOT_OUTPUT}/images/u-boot.bin" \
                > "${BUILDROOT_OUTPUT}/images/u-boot.strings"
              grep -Fx "baudrate=921600" \
                "${BUILDROOT_OUTPUT}/images/u-boot.strings"
              grep -Fx "console=ttyS0,921600" \
                "${BUILDROOT_OUTPUT}/images/u-boot.strings"
              grep -Fqx \
                "CONFIG_CMDLINE=\"console=ttyS0,921600n8 root=/dev/mmcblk0p2 rw rootfstype=ext4 rootwait\"" \
                "${BUILDROOT_OUTPUT}/build/linux-4.4.23/.config"
              grep -Eq \
                "^ttyS0::respawn:/sbin/getty .*[[:space:]]921600[[:space:]]" \
                "${BUILDROOT_OUTPUT}/target/etc/inittab"

              make O="${BUILDROOT_OUTPUT}" ccache-stats || true
            '

      - name: Report disk usage
        if: always()
        run: |
          df -h "${GITHUB_WORKSPACE}"

          for path in \
            "${BUILD_CACHE_ROOT:-${HOME}/.cache/radsat-linux}/buildroot-dl" \
            "${BUILD_CACHE_ROOT:-${HOME}/.cache/radsat-linux}/buildroot-ccache" \
            "${BUILD_OUTPUT_CACHE:-${HOME}/.cache/radsat-linux/buildroot-output}" \
            "${BUILD_CACHE_ROOT:-${HOME}/.cache/radsat-linux}/cargo" \
            "${BUILD_CACHE_ROOT:-${HOME}/.cache/radsat-linux}/cargo-target" \
            "${BUILD_OUTPUT_CACHE:-${HOME}/.cache/radsat-linux/buildroot-output}/build" \
            "${BUILD_OUTPUT_CACHE:-${HOME}/.cache/radsat-linux/buildroot-output}/target" \
            "${BUILD_OUTPUT_CACHE:-${HOME}/.cache/radsat-linux/buildroot-output}/images"; do
            if [[ -e "${path}" ]]; then
              du -sh "${path}"
            fi
          done

          du -sh /var/lib/docker 2>/dev/null || true

      - name: Audit packaged Kubos services
        continue-on-error: true
        run: |
          report="${BUILD_OUTPUT_CACHE}/images/service-packaging-audit.md"
          radsat-linux/tools/audit-service-packaging.sh \
            "${BUILD_OUTPUT_CACHE}/target" \
            "${report}"
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect build artifacts
        env:
          SOFTWARE_TAG: ${{ steps.software-version.outputs.software_tag }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          output_dir="${BUILD_OUTPUT_CACHE}"
          image_dir="${output_dir}/images"
          cp --link \
            "${image_dir}/kubos-linux.tar.gz" \
            "${image_dir}/aux-sd.tar.gz" \
            "${image_dir}/kernel" \
            "${image_dir}/zImage" \
            "${image_dir}/beaglebone-black.dtb" \
            "${image_dir}/MLO" \
            "${image_dir}/u-boot.img" \
            artifacts/
          cp --link "${output_dir}/build/build-time.log" artifacts/

          python3 - artifacts/build-time.log \
            artifacts/build-time-summary.txt <<'PY'
          import collections
          import re
          import sys

          source, destination = sys.argv[1:]
          starts = {}
          durations = collections.defaultdict(float)
          first = None
          last = None

          pattern = re.compile(
              r"^([0-9.]+):(start|end)\s*:([^:]+):\s*(.+?)\s*$"
          )
          with open(source, encoding="utf-8") as build_log:
              for line in build_log:
                  match = pattern.match(line)
                  if not match:
                      continue

                  timestamp = float(match.group(1))
                  event = match.group(2)
                  phase = match.group(3).strip()
                  package = match.group(4).strip()
                  key = (phase, package)
                  first = timestamp if first is None else min(first, timestamp)
                  last = timestamp if last is None else max(last, timestamp)

                  if event == "start":
                      starts[key] = timestamp
                  elif key in starts:
                      durations[package] += timestamp - starts.pop(key)

          with open(destination, "w", encoding="utf-8") as summary:
              elapsed = 0 if first is None else last - first
              summary.write(
                  f"Measured Buildroot package time: {elapsed / 60:.1f} min\n"
              )
              summary.write("\nLongest package builds:\n")
              for package, seconds in sorted(
                  durations.items(), key=lambda item: item[1], reverse=True
              )[:25]:
                  summary.write(f"{seconds / 60:7.1f} min  {package}\n")
          PY

          {
            echo "## Build timing"
            echo
            echo '```text'
            cat artifacts/build-time-summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "radsat-linux=${GITHUB_SHA}"
            echo "software_tag=${SOFTWARE_TAG}"
            echo "software_commit=$(git -C Software rev-parse HEAD)"
            echo "buildroot=${BUILDROOT_VERSION}"
            echo "linux=4.4.23"
          } > artifacts/build-info.txt

          (
            cd artifacts
            sha256sum \
              aux-sd.tar.gz \
              beaglebone-black.dtb \
              kernel \
              kubos-linux.tar.gz \
              MLO \
              u-boot.img \
              zImage \
              > SHA256SUMS
          )

          if [[ -f "${image_dir}/service-packaging-audit.md" ]]; then
            cp --link \
              "${image_dir}/service-packaging-audit.md" \
              artifacts/
          fi

      - name: Upload Linux image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.software-version.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
