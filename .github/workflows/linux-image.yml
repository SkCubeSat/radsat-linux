---
name: Build RadSat Linux Image

'on':
  workflow_dispatch:
    inputs:
      software_tag:
        description: Software release tag (blank uses BR2_KUBOS_VERSION)
        required: false
        type: string
  push:
    branches:
      - master

concurrency:
  group: radsat-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDROOT_VERSION: 2025.02.14
  BUILDROOT_SHA256: >-
    dc36c895d189d37f443d0352202ffd6a2436afcaf21570b4d9fbb177b56dee0b
  KUBOS_BUILD_IMAGE: kubos/kubos-dev
  KUBOS_BUILD_IMAGE_DIGEST: >-
    sha256:cd1a02e19b522d045b17bee6fb67a9f7909bb758eaa97ffd804d151b0e3d21b4

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 180

    steps:
      - name: Verify runner prerequisites
        run: |
          echo "Runner: ${RUNNER_NAME}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          df -h "${GITHUB_WORKSPACE}"
          docker info >/dev/null

      - name: Require checkout token
        env:
          CI_CHECKOUT_TOKEN: ${{ secrets.CI_CHECKOUT_TOKEN }}
        run: |
          if [[ -z "${CI_CHECKOUT_TOKEN}" ]]; then
            echo "::error::Add CI_CHECKOUT_TOKEN to the radsat-linux" \
              "repository or organization secrets."
            exit 1
          fi

      - name: Check out radsat-linux
        uses: actions/checkout@v6
        with:
          path: radsat-linux
          fetch-depth: 0

      - name: Resolve Software release tag
        id: software-version
        env:
          SOFTWARE_TAG_OVERRIDE: >-
            ${{ github.event.inputs.software_tag || '' }}
        run: |
          configured_tag="$(
            sed -n 's/^BR2_KUBOS_VERSION="\([^"]*\)"/\1/p' \
              radsat-linux/configs/beaglebone-black_defconfig
          )"
          software_tag="${SOFTWARE_TAG_OVERRIDE:-${configured_tag}}"

          if [[ -z "${software_tag}" ]]; then
            echo "::error::No Software tag was supplied and" \
              "BR2_KUBOS_VERSION is empty."
            exit 1
          fi

          artifact_tag="${software_tag//\//-}"
          artifact_name="radsat-linux-${GITHUB_SHA}-software-${artifact_tag}"
          echo "software_tag=${software_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_tag=${artifact_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "Building with SkCubeSat/Software tag ${software_tag}"

      - name: Check out tagged Software source
        uses: actions/checkout@v6
        with:
          repository: SkCubeSat/Software
          ref: ${{ steps.software-version.outputs.software_tag }}
          path: Software
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CI_CHECKOUT_TOKEN }}

      - name: Verify Software source is an exact tag
        env:
          SOFTWARE_TAG: ${{ steps.software-version.outputs.software_tag }}
        run: |
          if ! git -C Software show-ref --verify --quiet \
            "refs/tags/${SOFTWARE_TAG}"; then
            echo "::error::SkCubeSat/Software ref '${SOFTWARE_TAG}'" \
              "is not a tag."
            exit 1
          fi

          tag_commit="$(git -C Software rev-list -n 1 "${SOFTWARE_TAG}")"
          head_commit="$(git -C Software rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Software checkout does not match tag" \
              "${SOFTWARE_TAG}."
            exit 1
          fi

      - name: Cache Buildroot downloads
        uses: actions/cache@v5
        with:
          path: buildroot-dl
          key: >-
            buildroot-${{ env.BUILDROOT_VERSION }}-${{
            hashFiles('radsat-linux/configs/beaglebone-black_defconfig') }}
          restore-keys: |
            buildroot-${{ env.BUILDROOT_VERSION }}-

      - name: Cache Buildroot compiler objects
        uses: actions/cache@v5
        with:
          path: buildroot-ccache
          key: >-
            buildroot-ccache-v1-${{ runner.os }}-${{
            env.BUILDROOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            buildroot-ccache-v1-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-

      - name: Download Buildroot
        run: |
          archive="buildroot-${BUILDROOT_VERSION}.tar.gz"
          curl --fail --location --retry 5 \
            --output "${archive}" \
            "https://buildroot.org/downloads/${archive}"
          echo "${BUILDROOT_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}"

      - name: Build Linux image
        run: |
          mkdir -p buildroot-dl buildroot-ccache ci-home
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir "/workspace/buildroot-${BUILDROOT_VERSION}" \
            --env BR2_CCACHE_DIR=/workspace/buildroot-ccache \
            --env BR2_DL_DIR=/workspace/buildroot-dl \
            --env BR2_JLEVEL=0 \
            --env HOME=/workspace/ci-home \
            --env KUBOS_OVERRIDE_SRCDIR=/workspace/Software \
            "${KUBOS_BUILD_IMAGE}@${KUBOS_BUILD_IMAGE_DIGEST}" \
            bash -euxo pipefail -c '
              curl https://sh.rustup.rs -sSf |
                sh -s -- -y --default-toolchain 1.93.0 --profile minimal
              export PATH="${HOME}/.cargo/bin:${PATH}"
              rustup target add armv7-unknown-linux-gnueabihf

              make BR2_EXTERNAL=/workspace/radsat-linux \
                beaglebone-black_defconfig
              make source
              make
              make ccache-stats
            '

      - name: Report disk usage
        if: always()
        run: |
          df -h /

          for path in \
            buildroot-dl \
            buildroot-ccache \
            "buildroot-${BUILDROOT_VERSION}/output" \
            "buildroot-${BUILDROOT_VERSION}/output/build" \
            "buildroot-${BUILDROOT_VERSION}/output/target" \
            "buildroot-${BUILDROOT_VERSION}/output/images"; do
            if [[ -e "${path}" ]]; then
              du -sh "${path}"
            fi
          done

          du -sh /var/lib/docker 2>/dev/null || true

      - name: Collect build artifacts
        env:
          SOFTWARE_TAG: ${{ steps.software-version.outputs.software_tag }}
        run: |
          mkdir -p artifacts
          output_dir="buildroot-${BUILDROOT_VERSION}/output"
          image_dir="${output_dir}/images"
          cp --link \
            "${image_dir}/kubos-linux.tar.gz" \
            "${image_dir}/aux-sd.tar.gz" \
            "${image_dir}/kernel" \
            "${image_dir}/zImage" \
            "${image_dir}/beaglebone-black.dtb" \
            "${image_dir}/MLO" \
            "${image_dir}/u-boot.img" \
            artifacts/
          cp --link "${output_dir}/build/build-time.log" artifacts/

          python3 - artifacts/build-time.log \
            artifacts/build-time-summary.txt <<'PY'
          import collections
          import re
          import sys

          source, destination = sys.argv[1:]
          starts = {}
          durations = collections.defaultdict(float)
          first = None
          last = None

          pattern = re.compile(
              r"^([0-9.]+):(start|end)\s*:([^:]+):\s*(.+?)\s*$"
          )
          with open(source, encoding="utf-8") as build_log:
              for line in build_log:
                  match = pattern.match(line)
                  if not match:
                      continue

                  timestamp = float(match.group(1))
                  event = match.group(2)
                  phase = match.group(3).strip()
                  package = match.group(4).strip()
                  key = (phase, package)
                  first = timestamp if first is None else min(first, timestamp)
                  last = timestamp if last is None else max(last, timestamp)

                  if event == "start":
                      starts[key] = timestamp
                  elif key in starts:
                      durations[package] += timestamp - starts.pop(key)

          with open(destination, "w", encoding="utf-8") as summary:
              elapsed = 0 if first is None else last - first
              summary.write(
                  f"Measured Buildroot package time: {elapsed / 60:.1f} min\n"
              )
              summary.write("\nLongest package builds:\n")
              for package, seconds in sorted(
                  durations.items(), key=lambda item: item[1], reverse=True
              )[:25]:
                  summary.write(f"{seconds / 60:7.1f} min  {package}\n")
          PY

          {
            echo "## Build timing"
            echo
            echo '```text'
            cat artifacts/build-time-summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "radsat-linux=${GITHUB_SHA}"
            echo "software_tag=${SOFTWARE_TAG}"
            echo "software_commit=$(git -C Software rev-parse HEAD)"
            echo "buildroot=${BUILDROOT_VERSION}"
            echo "linux=4.4.23"
          } > artifacts/build-info.txt

          (
            cd artifacts
            sha256sum \
              aux-sd.tar.gz \
              beaglebone-black.dtb \
              kernel \
              kubos-linux.tar.gz \
              MLO \
              u-boot.img \
              zImage \
              > SHA256SUMS
          )

      - name: Upload Linux image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.software-version.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
